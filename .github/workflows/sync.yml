name: Sync LeetCode

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch and Save Submissions
        env:
          LEETCODE_SESSION: ${{ secrets.LEETCODE_SESSION }}
          LEETCODE_CSRF_TOKEN: ${{ secrets.LEETCODE_CSRF_TOKEN }}
        run: |
          python - << 'EOF'
          import os, requests, json

          session = os.environ.get('LEETCODE_SESSION')
          csrf = os.environ.get('LEETCODE_CSRF_TOKEN')

          headers = {
              'Cookie': f'LEETCODE_SESSION={session}; csrftoken={csrf};',
              'X-Csrf-Token': csrf,
              'Content-Type': 'application/json',
              'Referer': 'https://leetcode.com/'
          }

          query = """
          query submissionList($offset: Int!, $limit: Int!) {
            submissionList(offset: $offset, limit: $limit) {
              submissions {
                id
                title
                titleSlug
                statusDisplay
                lang
                timestamp
              }
            }
          }
          """

          res = requests.post(
              'https://leetcode.com/graphql',
              json={'query': query, 'variables': {'offset': 0, 'limit': 20}},
              headers=headers
          )

          data = res.json()
          if 'data' in data and data['data']['submissionList']:
              submissions = data['data']['submissionList']['submissions']
              os.makedirs('leetcode-solutions', exist_ok=True)
              
              for sub in submissions:
                  if sub['statusDisplay'] == 'Accepted':
                      filename = f"leetcode-solutions/{sub['titleSlug']}.txt"
                      with open(filename, 'w') as f:
                          f.write(f"Problem: {sub['title']}\nLanguage: {sub['lang']}\nStatus: {sub['statusDisplay']}\nTimestamp: {sub['timestamp']}\n")
              print("Saved solutions to folder!")
          else:
              print("Error fetching submissions:", data)
              exit(1)
          EOF

      - name: Commit & Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff-index --quiet HEAD || git commit -m "Sync LeetCode submissions [skip ci]"
          git push
